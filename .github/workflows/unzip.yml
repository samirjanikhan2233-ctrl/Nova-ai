name: Extract Nova AI Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ ! -f "NOVA-AI-Android-Project.zip" ]; then
            echo "ZIP not found. Nothing to do."
            exit 0
          fi

          mkdir extracted
          unzip -q "NOVA-AI-Android-Project.zip" -d extracted

          shopt -s dotglob
          items=(extracted/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -R "${items[0]}"/. .
          else
            cp -R extracted/. .
          fi

          rm -rf extracted
          rm -f "NOVA-AI-Android-Project.zip"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Nova AI Android project"
            git push
          fi
